# Why this exists: serves the single-page app. Unknown paths such as
# /dashboard fall back to index.html so React Router can handle them.
server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  location / {
    try_files $uri $uri/ /index.html;
  }

  # Built files have content hashes in their names, so they can be cached for a long time.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }
}
